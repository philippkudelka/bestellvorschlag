# Zehn Filialen im Landkreis Rosenheim.
# grundniveau: Groessenfaktor der Filiale (0.4 klein ... 1.8 gross).
# oeffnungszeiten: je Wochentag eine Liste von [von, bis]-Zeitraeumen
